[project]
name = "yread"
version = "0.5.0"
description = "Local lightweight repo-to-wiki generator inspired by zread."
readme = "README.md"
authors = [
    { name = "yread contributors" }
]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "markdown>=3.6",
    "openai>=1.30",
]
keywords = ["wiki", "documentation", "codebase", "llm", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/cyzlmh/yread"
Repository = "https://github.com/cyzlmh/yread"
Issues = "https://github.com/cyzlmh/yread/issues"

[project.scripts]
yread = "yread.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "/.env.yread.example",
    "/examples",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/skills",
    "/src",
    "/tests",
    "/uv.lock",
]

[tool.hatch.build.targets.wheel]
packages = ["src/yread"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
